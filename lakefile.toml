name = "EllipticCurves"
defaultTargets = ["EllipticCurves"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

# The explicit "EllipticCurves" glob elaborates the root aggregator module itself (the mk_all
# listing); with only the ".+" submodule glob a broken import line there would go unnoticed.
[[lean_lib]]
name = "EllipticCurves"
globs = ["EllipticCurves", "EllipticCurves.+"]

# Comparator (https://github.com/leanprover/comparator) verification harness. Not part of
# `defaultTargets`, so a plain `lake build` ignores it (and never builds the deliberate `sorry`
# in `comparator/Challenge.lean`). See comparator/README.md.
[[lean_lib]]
name = "Challenge"
srcDir = "comparator"

[[lean_lib]]
name = "Solution"
srcDir = "comparator"
