version: v0.4
project:
  name: 'Elliptic curves of exact ranks five, six, and seven: conditional formalization'
  description: Lean proves that the finite-complexity affine-linear prime asymptotic implies infinitely
    many geometric isomorphism classes of rational elliptic curves of each exact Mordell–Weil rank five,
    six, and seven. The generic analytic theorem is an explicit hypothesis. The specialization checks,
    two-isogeny descent, exact rank calculations, and passage to infinitely many j-invariants are formalized;
    the prime asymptotic is not proved in Lean here.
  authors:
  - P. M. Aronow
  - Patrick Lopatto
  responsible_maintainers:
  - P. M. Aronow
  license: Apache-2.0
classification:
  arxiv:
  - math.NT
  msc2020:
  - 11G05
  - 11N32
