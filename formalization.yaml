fidelity:
  divergences: 'The manuscript states an unconditional theorem using established analytic results. Lean
    proves the corresponding implication with an explicit generic prime-asymptotic hypothesis; that analytic
    theorem is not proved here. The hypothesis is restricted to twelve forms in two variables on positive
    area-one rectangles, sufficient for the families. Rank is the cardinal rank of the actual rational-point
    group, with finite generation supplied by a proved Mordell–Weil theorem. Infinitude uses actual rational
    j-invariants of nonsingular models and the proved equivalence between j equality and geometric isomorphism.
    All unchanged literal arithmetic has been reconciled against the updated manuscript. The Lean infinitude
    proof uses different sufficient positive sectors and proves global geometric infinitude; it does not
    claim infinitude inside the manuscript narrow cones (rank six: 29N<M<31N; rank seven: 2999N<M<3001N).
    The transported rank-seven sector lies above the latter cone. Exact-rank lemmas apply to general positive
    prime specializations. Supplementary arbitrary-characteristic-zero-field statements, full local Qp
    image equalities, Z-independence of the exact five displayed rank-five points, the generic degree-twelve
    projective j morphism/exact twelve-point fiber bound, K3/fiber-type classification and conic-origin
    constructions are outside the selected theorem. The checked necessary rational image restrictions,
    independent descent classes and finite rational j fibers suffice for the main conclusion.'
